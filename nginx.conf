# 1. HTTPS Server (Catches brovian.de and all subdomains *.brovian.de)
server {
    listen 443 ssl;
    server_name brovian.de *.brovian.de;

    # SSL Certificates (issued via DNS-01 wildcard)
    ssl_certificate /etc/letsencrypt/live/brovian.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brovian.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Port where your Express app is listening (adjust if needed)
        proxy_pass http://127.0.0.1:30008;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward the exact host (e.g. kadkmakdma.brovian.de) to Express
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. HTTP Server (Redirects all HTTP traffic to HTTPS)
server {
    listen 80;
    server_name brovian.de *.brovian.de;

    # Redirect any subdomain on HTTP to the same subdomain on HTTPS
    return 301 https://$host$request_uri;
}
